<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body { font-family: 'DM Sans', sans-serif; background: #fafafa; color: #111; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .box { text-align: center; max-width: 480px; padding: 3rem 2rem; }
  .icon { font-size: 4rem; margin-bottom: 1.5rem; }
  h1 { font-family: 'Cormorant Garamond', serif; font-size: 3rem; font-weight: 300; font-style: italic; margin-bottom: 1rem; }
  p { color: #888; line-height: 1.8; margin-bottom: 2rem; }
  a { display: inline-block; padding: 1rem 2.5rem; background: #111; color: #fff; text-decoration: none; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; }
  a:hover { background: #c8a96e; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">🎉</div>
    <h1>Order confirmed!</h1>
    <p>Thank you for your purchase. Your payment was successful and your order is being processed. You'll receive a confirmation email shortly.</p>
    <a href="index.html">Continue Shopping</a>

</html>
